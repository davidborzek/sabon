name: docs

# Versioned docs via Zensical's mike fork (https://zensical.org/docs/setup/versioning/):
#   - every push to main updates the `dev` version;
#   - releases publish `X.Y.Z` and move the `latest` alias from the *release*
#     workflow (release-please creates the GitHub release with GITHUB_TOKEN,
#     which does not trigger a `release` event here);
#   - workflow_dispatch with a `version` input republishes a version manually.
# mike commits the built site to `gh-pages`, so set the repository's Pages source
# to "Deploy from a branch" -> gh-pages (one-time setting).
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - .github/workflows/docs.yaml
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0 (empty = deploy dev)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # Zensical + its fork of mike (mike is not published on PyPI).
      - run: pip install zensical git+https://github.com/squidfunk/mike.git
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy dev docs
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.version == '')
        run: mike deploy --push dev
      - name: Deploy versioned docs
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          mike deploy --push --update-aliases "${{ inputs.version }}" latest
          mike set-default --push latest
