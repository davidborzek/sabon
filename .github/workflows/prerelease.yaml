name: prerelease

# Manual prerelease tags (e.g. v0.1.0-alpha.1) build and publish binaries and
# images as a GitHub pre-release, bypassing release-please (which owns stable
# releases from Conventional Commits on main). The "v*-*" filter matches only
# tags with a prerelease segment (a "-"), so stable tags (v0.1.0) never trigger
# this and are handled by release.yaml instead.
#
# goreleaser marks the release as a pre-release (release.prerelease: auto) and
# skips the floating "latest"/"major.minor" image tags for it.
on:
  push:
    tags:
      - "v*-*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zfs-snapshotter:
    # Tiny alpine+nsenter image for the "zfs" snapshot strategy. A prerelease
    # only publishes the tag-specific image, never the floating "latest".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.zfs-snapshotter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/davidborzek/sabon/zfs-snapshotter:${{ github.ref_name }}
