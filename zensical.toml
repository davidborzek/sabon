[project]
site_name = "sabon"
site_description = "Label-driven restic backup orchestrator for Docker"
site_author = "David Borzek"
site_url = "https://davidborzek.github.io/sabon/"
copyright = "Copyright &copy; 2026 David Borzek"
repo_url = "https://github.com/davidborzek/sabon"
repo_name = "davidborzek/sabon"

nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Configuration" = "configuration.md" },
    { "Labels" = "labels.md" },
    { "Hooks" = "hooks.md" },
    { "Backups" = "backups.md" },
    { "Restore" = "restore.md" },
    { "Deployment" = "deployment.md" },
    { "Troubleshooting" = "troubleshooting.md" },
    { "FAQ" = "faq.md" },
  ] },
  { "Reference" = [
    { "Observability" = "metrics.md" },
    { "Architecture" = "architecture.md" },
    { "API" = "api.md" },
  ] },
]

# ---------------------------------------------------------------------------
# Theme — "modern" is the default (a fresh design); "classic" mirrors the old
# Material for MkDocs look.
# ---------------------------------------------------------------------------
[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/archive-restore"

[project.theme.icon.tag]
default = "lucide/tag"
swarm = "lucide/boxes"
security = "lucide/shield"
backup = "lucide/archive"
restore = "lucide/archive-restore"
snapshot = "lucide/camera"
config = "lucide/settings"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/davidborzek/sabon"

[project.extra.tags]
Swarm = "swarm"
Security = "security"
Backups = "backup"
Restore = "restore"
Snapshots = "snapshot"
Configuration = "config"

# Multi-version docs via Zensical's mike fork (see docs workflow). The version
# selector appears in the header; `latest` is the default users land on.
[project.extra.version]
provider = "mike"
default = "latest"

# ---------------------------------------------------------------------------
# Markdown extensions (Zensical defaults + tables for the reference tables).
# ---------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
